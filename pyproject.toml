[project]
name = "giterator"
version = "0.3.0"
description = "Python tools for doing git things."
readme = "README.rst"
authors = [{ name = "Chris Withers", email = "chris@withers.org" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/simplistix/giterator"
Documentation = "https://giterator.readthedocs.org/en/latest/"
Repository = "https://github.com/simplistix/giterator"
Changelog = "https://giterator.readthedocs.io/en/latest/changes.html"

[project.scripts]
giterator = "giterator.cli:main"

[dependency-groups]
dev = [
    "coverage-enable-subprocess>=1.0",
    "mypy>=1.0",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
    "testfixtures>=11",
]
docs = [
    "furo>=2024",
    "sphinx>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giterator"]

[tool.pytest.ini_options]
addopts = "-p no:doctest"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "preserve"

[tool.coverage.run]
source = ["giterator", "tests"]
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
